name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - id: check
        run: |
          REF="${GITHUB_REF_NAME}"
          PUBLISH=false
          MODE=skip
          if [[ "$REF" =~ ^npm-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PUBLISH=true
            MODE=package
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$REF" =~ ^release- ]]; then
            PUBLISH=true
            MODE=shared
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF} publish=${PUBLISH} mode=${MODE}"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Resolve version
        id: version
        env:
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = package ]; then
            test "${GITHUB_REF_NAME}" = "npm-v${VERSION}"
          fi
          if [ "$MODE" = shared ]; then
            if npm view "indonesia-holidays@${VERSION}" version >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "npm ${VERSION} already published; skipping"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify package
        if: steps.version.outputs.skip != 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish --access public
