name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Independent versioning: npm tags are v0.1.1; Python uses python-v0.1.0
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      - name: Verify version
        run: |
          node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Verify package
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Publish
        run: npm publish --access public
