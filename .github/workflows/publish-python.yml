name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Independent versioning: Python tags are python-v0.1.0; npm uses v0.1.1
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build
      - name: Verify version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "python-v${VERSION}"
      - name: Verify package
        run: |
          ruff check src tests hatch_build.py scripts
          ruff format --check src tests hatch_build.py scripts
          mypy
          pytest
          TZ=Pacific/Pago_Pago pytest
          TZ=Pacific/Kiritimati pytest
          python -m build
          python scripts/verify_distribution.py
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
