name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: python
        run: |
          ruff check src tests hatch_build.py scripts
          ruff format --check src tests hatch_build.py scripts
      - name: Typecheck
        working-directory: python
        run: mypy
      - name: Test
        working-directory: python
        run: |
          pytest
          TZ=Pacific/Pago_Pago pytest
          TZ=Pacific/Kiritimati pytest
      - name: Build distributions and confirm the shared dataset
        working-directory: python
        run: |
          python -m pip install build
          python -m build
          python scripts/verify_distribution.py
